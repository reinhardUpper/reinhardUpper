name: Generate Snake (Test)

on:
  workflow_dispatch: # можно запускать вручную

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем текущий репозиторий
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Создаём фиктивные коммиты, чтобы Snake точно сгенерировалась
      - name: Create dummy commits
        run: |
          mkdir -p dummy
          for i in {1..10}; do
            echo "dummy $i" >> dummy/file.txt
            git add dummy/file.txt
            git commit -m "Dummy commit $i"
          done

      # 3. Генерируем Snake
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: reinhardUpper
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      # 4. Проверяем, что файлы создались
      - name: List dist
        run: ls -la dist

      # 5. Пушим на ветку output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          create_branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
